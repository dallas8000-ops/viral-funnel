<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Members</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" />
  <link rel="stylesheet" href="/static/app.css" />
</head>
<body>
  <main class="join">
    <h1>You're in.</h1>
    <p class="muted" id="msg">Confirming subscription…</p>
    <p id="discord"></p>
  </main>
  <script>
    const params = new URLSearchParams(location.search);
    const sessionId = params.get("session_id") || "";
    const token = params.get("token") || localStorage.getItem("vf_token") || "";
    const msg = document.getElementById("msg");
    const discord = document.getElementById("discord");
    const q = sessionId ? `session_id=${encodeURIComponent(sessionId)}` : `token=${encodeURIComponent(token)}`;
    fetch(`/api/community?${q}`)
      .then((r) => r.json())
      .then((d) => {
        if (!d.ok) {
          msg.textContent = sessionId
            ? "Payment is still settling. Refresh in a few seconds. If this persists, check the Stripe webhook."
            : "Open this page after checkout, or use the access link from your receipt.";
          return;
        }
        if (d.token) localStorage.setItem("vf_token", d.token);
        msg.textContent = `Paid as ${d.email}. This is the room.`;
        if (d.discord) {
          discord.innerHTML = `<a class="btn-primary" href="${d.discord}">Open Discord</a>`;
        } else {
          discord.textContent = "Discord invite is not configured yet. You are still a paid member.";
        }
      })
      .catch(() => {
        msg.textContent = "Could not confirm membership.";
      });
  </script>
</body>
</html>
